spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ffaas}
    username: ${DB_USER:ffaas}
    password: ${DB_PASSWORD:ffaas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

ffaas:
  cache:
    flag-ttl: 60s
    flag-max-size: 10000
    evaluation-ttl: 30s
    evaluation-max-size: 10000
