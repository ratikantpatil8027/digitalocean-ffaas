spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ffaas}
    username: ${DB_USER:ffaas}
    password: ${DB_PASSWORD:ffaas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
